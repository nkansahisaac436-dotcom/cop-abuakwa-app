  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  http: ^1.3.0
  path_provider: ^2.1.5
  image: ^4.5.2

dev_dependencies:
  flutter_test:
