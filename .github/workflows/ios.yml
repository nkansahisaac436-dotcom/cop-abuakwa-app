name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_analyze:
    name: Run Analysis & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env from template
        run: cp .env.example .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: |
          set +e
          flutter test --reporter=expanded > test_output.txt 2>&1
          TEST_EXIT_CODE=$?
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-log
          git add test_output.txt
          git commit -m "ci: test output log" || true
          git push -f origin ci-log || true
          cat test_output.txt
          exit $TEST_EXIT_CODE
